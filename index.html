<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rafael Mestre · Portfólio</title>
  <meta name="description" content="Compras & Suprimentos e desenvolvedor em formação (ADS PUC Minas). Projetos, contatos e redes sociais." />
  <meta name="theme-color" content="#0a0b0d" />

  <!-- Open Graph (prévia no WhatsApp / LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Rafael Mestre · Portfólio" />
  <meta property="og:description" content="Projetos, contatos e redes sociais." />
  <meta property="og:url" content="https://rafaelmestre.netlify.app/" />
  <meta property="og:image" content="https://rafaelmestre.netlify.app/assets/img/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://rafaelmestre.netlify.app/" />

  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="assets/img/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <script>
    // aplica o tema salvo antes de pintar (evita "piscar")
    try {
      const t = localStorage.getItem("tema") ||
        (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#projetos">Pular para projetos</a>

  <header class="topbar">
    <span class="brand">rafael<span class="accent">.</span>mestre</span>
    <nav class="nav" aria-label="Navegação principal">
      <a href="#sobre">Sobre</a>
      <a href="#projetos">Projetos</a>
      <a href="#contato">Contato</a>
    </nav>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Alternar tema claro/escuro">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero" id="sobre">
      <div class="hero-bg" aria-hidden="true"><span></span><span></span></div>
      <div class="hero-photo">
        <img id="foto" src="" alt="Foto de Rafael Mestre" width="240" height="240" />
        <span class="status"><span class="dot"></span>Aberto a oportunidades</span>
      </div>
      <div class="hero-text">
        <p class="eyebrow mono" id="local"></p>
        <h1 id="nome"></h1>
        <p class="titulo" id="titulo"></p>
        <p class="resumo" id="resumo"></p>
        <div class="cta" id="cta"></div>
      </div>
    </section>

    <!-- PROJETOS -->
    <section class="section" id="projetos">
      <div class="section-head reveal">
        <h2><span class="mono num">01</span> Projetos</h2>
        <div class="filtros" id="filtros" role="group" aria-label="Filtrar projetos por tecnologia"></div>
      </div>
      <div class="grid" id="gridProjetos"></div>
    </section>

    <!-- HABILIDADES -->
    <section class="section" id="habilidades">
      <div class="section-head reveal">
        <h2><span class="mono num">02</span> Habilidades</h2>
      </div>
      <div class="skills" id="skills"></div>
    </section>

    <!-- CONTATO -->
    <section class="section" id="contato">
      <div class="section-head reveal">
        <h2><span class="mono num">03</span> Contato</h2>
      </div>
      <div class="contact-card reveal">
        <p>Quer conversar sobre uma vaga, um projeto ou uma ideia? Me chama.</p>
        <div class="links" id="links"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>© <span id="ano"></span> Rafael Mestre</span>
    <span class="mono">feito à mão · HTML, CSS & JS</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
